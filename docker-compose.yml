services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379
      - BATCH_SIZE=50
      - BATCH_FLUSH_INTERVAL=10
    depends_on:
      - redis
    volumes:
      - ./dataset.txt:/app/dataset.txt
      - ./frontend:/app/frontend
    restart: unless-stopped

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
